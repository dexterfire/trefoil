name: Android
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.1.0'
      - name: Assemble debug and release APKs
        working-directory: android
        run: |
          if [ -n "$TREFOIL_KEYSTORE_B64" ]; then
            echo "$TREFOIL_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/trefoil-release.jks"
            export TREFOIL_KEYSTORE_FILE="$RUNNER_TEMP/trefoil-release.jks"
          fi
          ./gradlew :app:assembleDebug :app:assembleRelease
        env:
          TREFOIL_KEYSTORE_B64: ${{ secrets.TREFOIL_KEYSTORE_B64 }}
          TREFOIL_KEYSTORE_PASSWORD: ${{ secrets.TREFOIL_KEYSTORE_PASSWORD }}
          TREFOIL_KEY_ALIAS: ${{ secrets.TREFOIL_KEY_ALIAS }}
          TREFOIL_KEY_PASSWORD: ${{ secrets.TREFOIL_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: trefoil-debug
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: trefoil-release
          path: android/app/build/outputs/apk/release/*.apk
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.1.0'
      - working-directory: android
        run: ./gradlew :core:model:test :core:ssh:test :core:protocol:test :core:session:test :app:testDebugUnitTest :app:lintDebug
